name: iOS CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

jobs:
  test-ios-core:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run TagSpeakCore Swift Unit Tests
        working-directory: ios
        run: swift test

      - name: Typecheck iOS App Sources
        working-directory: ios
        run: |
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios17.0-simulator \
            -typecheck \
            Sources/TagSpeakCore/*.swift \
            TagSpeakApp/*.swift

      - name: Build iOS App Target (Simulator, Unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project TagSpeak.xcodeproj \
            -scheme TagSpeak \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
