name: iOS CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

jobs:
  test-ios-core:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run TagSpeakCore Swift Unit Tests
        working-directory: ios
        run: swift test

      - name: Typecheck iOS App Sources
        working-directory: ios
        run: |
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios16.0-simulator \
            -typecheck \
            Sources/TagSpeakCore/*.swift \
            TagSpeakApp/*.swift
