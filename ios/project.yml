name: TagSpeak
options:
  bundleIdPrefix: com.tagspeak
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  TagSpeakCore:
    path: .

targets:
  TagSpeak:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TagSpeakApp
        excludes:
          - "Info.plist"
          - "TagSpeak.entitlements"
    info:
      path: TagSpeakApp/Info.plist
      properties:
        CFBundleDisplayName: TagSpeak
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NFCReaderUsageDescription: "TagSpeak scans NFC stickers to read spoken labels aloud and to write new spoken labels onto stickers."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: TagSpeakApp/TagSpeak.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - TAG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tagspeak.app
        DEVELOPMENT_TEAM: RD65N62WBS
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: TagSpeakApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: TagSpeakApp/TagSpeak.entitlements
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: TagSpeakCore
        product: TagSpeakCore
      - sdk: CoreNFC.framework
      - sdk: AVFoundation.framework
      - sdk: AppIntents.framework

  TagSpeakTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/TagSpeakCoreTests
    dependencies:
      - target: TagSpeak
      - package: TagSpeakCore
        product: TagSpeakCore
